## 提交步骤（仓库满 1 天后）

```sh
# 1) fork（一次性）
gh repo fork awesome-dsh-plugin/awesome-dsh-plugin --clone=false

# 2) 把本仓库 docs/market-submission.yml 的 "---" 以下内容写成 yml，
#    提交到 fork 的 data/plugins/WangXuexin24__dsh-session-topics.yml
#    （用 gh api 逐文件提交，或 clone 后 git commit + push 到新分支都行）

# 3) 开 PR（一个 PR 最多 3 条，我们只有 1 条）
gh pr create --repo awesome-dsh-plugin/awesome-dsh-plugin \
  --title "Add WangXuexin24/dsh-session-topics" \
  --body "Adds dsh-session-topics: sidebar topic grouping for DSH web (client-only, zero host-service dependency)."
```

CI 依次检查：条目数量 → `dsh.bundle` → 仓库年龄 → `awesome-lint`。失败时会指出要改什么，
**在同一分支推修复即可，无需重开 PR**。

